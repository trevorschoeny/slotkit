// SlotKit: slots for Fabric mods, built on MenuKit (formerly MenuKit: Containers).
// Two tiers in one jar: a client tier that finds and acts on slots in any menu on any
// server (slot groups, operations, vetoes), and a client-and-server tier that builds
// real slots (created slots, custom menus, storage, per-slot state). Universal
// (`environment: "*"`), since a server with SlotKit enforces the same rules.
//
// Depends on :menukit through its public API only (verifyOneWay below), never the
// reverse.

plugins {
    // The Loom plugin id is namespaced from 1.15 on, and 1.17 is the line for
    // 26.2. The version is pinned at the workspace root.
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'java-library'
    id 'com.modrinth.minotaur' version '2.+'
}

version = property('slotkit_version')
group   = 'com.trevlar'

base.archivesName = 'slotkit'

// Stamp the real mod version into fabric.mod.json at build time. The manifest
// used to hardcode "1.0.0": bumping the Gradle version renamed the jar, but the
// loader reads fabric.mod.json and still saw 1.0.0, so every published artifact
// reported 1.0.0 and no versioned dependency gate could be satisfied (this once
// stopped Keybindery from booting). fabric.mod.json now declares
// "version": "${version}" and this block expands it from the project version.
processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

java {
    // Minecraft 26.x runs on Java 25.
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    // Optional grave-mod adapters (compileOnly below).
    maven { url 'https://api.modrinth.com/maven' }   // Universal Graves, Pneumono's Gravestones
    maven { url 'https://maven.nucleoid.xyz' }        // UG's transitive deps (xyz.nucleoid / Polymer)
}

// MenuKit's client source set must exist before this project reads it.
evaluationDependsOn(':menukit')

dependencies {
    // 26.x is unobfuscated: no mappings line, and mod dependencies use the
    // standard Java configurations (implementation instead of modImplementation).
    minecraft "com.mojang:minecraft:${property('minecraft_version')}"
    implementation "net.fabricmc:fabric-loader:${property('loader_version')}"
    implementation "net.fabricmc.fabric-api:fabric-api:${property('fabric_version')}"

    // One-way dependency: SlotKit depends on MenuKit, and MenuKit never
    // depends on SlotKit. `api` rather than `implementation`, so a mod
    // depending on :slotkit gets :menukit at compile time too and
    // reaches both through one project dependency. Needs the `java-library`
    // plugin above for the `api` configuration. On 26.x there is no remap
    // layer and no `namedElements` variant, so a plain project dependency is
    // the artifact.
    api project(':menukit')

    // For the @ApiStatus.Internal markers. Compile-only, so consumers don't pick
    // up jetbrains-annotations at runtime. The annotation is only a doc and IDE
    // signal.
    compileOnly 'org.jetbrains:annotations:24.1.0'

    // Grave-mod compat adapters. Optional: these compile against the grave mods'
    // capture APIs, but SlotKit hard-depends on neither. Each adapter class
    // loads only behind a FabricLoader isModLoaded(...) guard, and the plain
    // drop-handling fallback applies when the mod is absent.
    // Universal Graves 3.12.0+26.2 is its 26.2 release. The old 1.21.11 jar is
    // intermediary-mapped and can't be compiled against without remapping.
    compileOnly "maven.modrinth:universal-graves:3.12.0+26.2"
    // Pneumono's Gravestones is deferred and uses the fallback. It was blocked
    // because its jar was built with a newer Loom than the workspace's 1.14.
    // The workspace is now on Loom 1.17, but re-enabling the adapter needs a
    // 26.2 Pneumono build and the adapter verified again.
    // compileOnly "maven.modrinth:pneumono_gravestones:1.4.1+1.21.11+A"
}

loom {
    // Anything that touches a screen lives in src/client. src/main runs on both
    // sides, and the compiler refuses a main class that reaches a client one.
    splitEnvironmentSourceSets()
    mods {
        'slotkit' {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
    runs {
        client { ideConfigGenerated = false }
        // Test Gallery: boots straight into the generated test world in run/saves/TestGallery.
        // Generate it with `test-gallery/run-scene.sh <mod> <scene>` (which also runs this).
        testGallery {
            inherit client
            name 'Test Gallery'
            programArgs '--quickPlaySingleplayer', 'TestGallery'
            ideConfigGenerated = false
        }
        server { ideConfigGenerated = false }
    }
}

// Declared after loom {} so the client source set exists. MenuKit splits its source
// sets too, so its client half is added here. A published jar holds both halves;
// this is only how a project dependency sees them.
dependencies {
    clientImplementation rootProject.project(':menukit').sourceSets.client.output
}

jar {
    from('LICENSE') { rename { "${it}_${project.name}" } }
}

// ── Modrinth Publishing ────────────────────────────────────────────────
// SlotKit takes over MenuKit: Containers' Modrinth project (xQUBXV8I), renamed. Only
// Lead publishes. Declares MenuKit as a required dependency.
modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = "xQUBXV8I"
    versionNumber = property('slotkit_version')
    versionName = "SlotKit ${property('slotkit_version')}"
    versionType = "release"
    // ci-cd.md stage 5: the player-facing changelog lives in changelog.md, one entry,
    // overwritten each release (git keeps the history).
    changelog = file('changelog.md').text
    // The public description comes from Notion through Lead's sync.
    syncBodyFrom = file('MODRINTH.md').text
    // 26.x: no remap step; `jar` is the shippable artifact.
    uploadFile = jar
    gameVersions = [property('minecraft_version')]
    loaders = ["fabric"]
    dependencies {
        required.project "fabric-api"
        required.project "menukit"
    }
}

// No pre-release of SlotKit 1 is ever published: a 6.x consumer's ceiling would
// admit it. A version with a pre-release part (a '-' before the '+') never uploads.
tasks.named('modrinth') {
    doFirst {
        def v = project.version.toString()
        if (v.split('\\+')[0].contains('-')) {
            throw new GradleException("SlotKit ${v} is a pre-release; SlotKit never publishes one to Modrinth.")
        }
    }
}

// The shipped jar must report the bumped version. A jar with the wrong version
// silently breaks every dependency gate against it, so this fails the build rather
// than relying on someone remembering to unzip it and look.
tasks.register('verifyJarVersion') {
    dependsOn 'jar'
    doLast {
        def jar = tasks.named('jar').get().archiveFile.get().asFile
        def modJson = zipTree(jar).matching { include 'fabric.mod.json' }.singleFile
        def stamped = new groovy.json.JsonSlurper().parse(modJson).version
        if (stamped != project.version.toString()) {
            throw new GradleException("${jar.name}: fabric.mod.json says ${stamped}, expected ${project.version}")
        }
        println "verifyJarVersion: ${jar.name} reports ${stamped}"
    }
}
build.dependsOn verifyJarVersion

// Javadoc for the published API reference: SlotKit's api packages only. MenuKit's
// reference is MenuKit's own; links into it resolve through the classpath.
javadoc {
    source += sourceSets.client.allJava
    classpath += sourceSets.client.compileClasspath + sourceSets.main.output + sourceSets.client.output
    include 'com/trevlar/slotkit/api/**'
    options.addBooleanOption('Xdoclint:all,-missing,-html,-accessibility', true)
    options.tags = ['implNote:a:Implementation note:', 'implSpec:a:Implementation requirements:', 'apiNote:a:API note:']
    options.encoding = 'UTF-8'
    options.windowTitle = "SlotKit ${project.version}"
}

// One Kit range per library: the declared MenuKit range must be
// ">=<major>.<minor>.0 <<major+1>.0.0" of menukit_version, the floor at the
// major.minor this build compiles against.
tasks.register('verifyKitRanges') {
    def src = file('src/main/resources/fabric.mod.json')
    def menukit = project.property('menukit_version').toString()
    inputs.file src
    inputs.property 'menukit', menukit
    doLast {
        def depends = new groovy.json.JsonSlurper().parse(src).depends ?: [:]
        def (major, minor) = menukit.split('\\+')[0].split('\\.')
        def expected = ">=${major}.${minor}.0 <${(major as int) + 1}.0.0"
        def declared = depends['menukit']?.toString()
        if (declared != expected) {
            throw new GradleException("fabric.mod.json: 'menukit' is '${declared}', expected '${expected}' (menukit_version ${menukit}).")
        }
        if (depends.containsKey('menukit-containers')) {
            throw new GradleException("fabric.mod.json depends on 'menukit-containers': Containers is SlotKit now.")
        }
        println "verifyKitRanges: menukit ${declared}"
    }
}
build.dependsOn verifyKitRanges

// One way only: SlotKit reaches MenuKit through its public API alone.
// Two halves: no source names a MenuKit package outside com.trevlar.menukit.api, and
// no compiled SlotKit class references a MenuKit class or member marked
// @ApiStatus.Internal (read from MenuKit's class files with ASM, since a few such
// members sit in api packages for MenuKit's own wiring).
tasks.register('verifyOneWay') {
    dependsOn 'classes', 'clientClasses', ':menukit:classes', ':menukit:clientClasses'
    def sources = fileTree('src') { include '**/*.java' }
    def ours = files(sourceSets.main.output.classesDirs, sourceSets.client.output.classesDirs)
    def theirs = files(project(':menukit').sourceSets.main.output.classesDirs,
                       project(':menukit').sourceSets.client.output.classesDirs)
    inputs.files(sources, ours)
    doLast {
        def bad = []
        sources.files.each { f ->
            def rel = projectDir.toPath().relativize(f.toPath())
            f.readLines().eachWithIndex { line, i ->
                (line.replaceAll('//.*', '') =~ /com\.trevlar\.menukit\.(\w+)/).each { m ->
                    if (m[1] != 'api') bad << "${rel}:${i + 1}: ${m[0]}"
                }
            }
        }
        // MenuKit's internal marks: whole classes, and members as owner.name.
        def INTERNAL = 'Lorg/jetbrains/annotations/ApiStatus$Internal;'
        def internal = [] as Set
        theirs.asFileTree.matching { include '**/*.class' }.each { cf ->
            def cn = new org.objectweb.asm.tree.ClassNode()
            new org.objectweb.asm.ClassReader(cf.bytes).accept(cn, 0)
            def marked = { node -> (node.invisibleAnnotations ?: []).any { it.desc == INTERNAL } }
            if (marked(cn)) internal << cn.name
            cn.methods.each { if (marked(it)) internal << "${cn.name}.${it.name}" }
            cn.fields.each { if (marked(it)) internal << "${cn.name}.${it.name}" }
        }
        ours.asFileTree.matching { include '**/*.class' }.each { cf ->
            def cn = new org.objectweb.asm.tree.ClassNode()
            new org.objectweb.asm.ClassReader(cf.bytes).accept(cn, 0)
            cn.methods.each { m ->
                m.instructions.each { insn ->
                    def owner = null, name = null
                    if (insn instanceof org.objectweb.asm.tree.MethodInsnNode || insn instanceof org.objectweb.asm.tree.FieldInsnNode) {
                        owner = insn.owner; name = insn.name
                    } else if (insn instanceof org.objectweb.asm.tree.TypeInsnNode) {
                        owner = insn.desc
                    }
                    if (owner == null || !owner.startsWith('com/trevlar/menukit/')) return
                    if (!owner.startsWith('com/trevlar/menukit/api/')) bad << "${cn.name}: ${owner}"
                    else if (internal.contains(owner) || (name && internal.contains("${owner}.${name}"))) {
                        bad << "${cn.name}.${m.name}: @ApiStatus.Internal ${owner}${name ? '.' + name : ''}"
                    }
                }
            }
        }
        if (bad) throw new GradleException("SlotKit reaches into MenuKit's internals:\n  " + bad.unique().join('\n  '))
        println "verifyOneWay: SlotKit uses only MenuKit's public API (${internal.size()} internal marks checked)"
    }
}
check.dependsOn verifyOneWay
